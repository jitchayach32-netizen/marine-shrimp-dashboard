<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ราคากุ้งตลาดทะเลไทย - ระบบข้อมูลกุ้งทะเล</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
</head>
<body>
  <div class="page">
    <div class="page__header">
      <h1 class="page__title">ราคากุ้งขาวแวนนาไมเฉลี่ยรายเดือน ณ ตลาดทะเลไทย จ.สมุทรสาคร</h1>
      <p class="page__subtitle">หน่วย: บาท/กก. - ข้อมูลนี้ไม่มีมิติรายจังหวัด เป็นราคาตลาดกลางแห่งเดียว (แสดงทุกขนาดพร้อมกัน แยกกราฟตามปีที่เลือก)</p>
    </div>

    <div class="filter-bar">
      <div class="filter-field filter-field--checkboxes">
        <label>ปี (ค.ศ.) - เลือกได้หลายปี</label>
        <div class="checkbox-group" id="yearFilter"></div>
      </div>
      <button class="btn btn-primary" id="applyFilter">แสดงผล</button>
    </div>

    <div class="export-bar" id="exportBar"></div>

    <div id="priceChartsContainer"></div>

    <div class="card">
      <div class="card__title">ข้อมูลรายละเอียด</div>
      <div id="tableWrap"><div class="loading-state">กำลังโหลดข้อมูล...</div></div>
    </div>
  </div>

  <script src="/assets/js/vendor/chart.umd.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/charts.js"></script>
  <script>
    const MONTH_LABELS_TH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
    const SIZE_CATEGORIES = ['40', '50', '60', '70', '80', '90', '100'];
    let priceCharts = [];

    function formatNumber(n) { return n == null ? '-' : n.toLocaleString('th-TH', { maximumFractionDigits: 2 }); }

    function populateYearOptions() {
      const currentYear = new Date().getFullYear();
      const years = [];
      for (let y = 2022; y <= currentYear; y++) years.push(y);

      const yearGroup = document.getElementById('yearFilter');
      yearGroup.innerHTML = years.map((y) => `
        <label class="checkbox-group__item">
          <input type="checkbox" class="year-checkbox" value="${y}" ${y >= currentYear - 1 ? 'checked' : ''} />
          ${y}
        </label>
      `).join('');
    }

    function getSelectedYears() {
      return Array.from(document.querySelectorAll('#yearFilter .year-checkbox:checked'))
        .map((cb) => parseInt(cb.value, 10))
        .sort((a, b) => a - b);
    }

    function currentFilters() {
      const years = getSelectedYears();
      return {
        yearFrom: years.length > 0 ? years[0] : undefined,
        yearTo: years.length > 0 ? years[years.length - 1] : undefined
      };
    }

    async function loadData() {
      const tableWrap = document.getElementById('tableWrap');
      tableWrap.innerHTML = '<div class="loading-state">กำลังโหลดข้อมูล...</div>';

      const selectedYears = getSelectedYears();
      if (selectedYears.length === 0) {
        tableWrap.innerHTML = '<div class="empty-state">กรุณาเลือกอย่างน้อย 1 ปี</div>';
        priceCharts.forEach((c) => ShrimpCharts.destroy(c));
        priceCharts = [];
        document.getElementById('priceChartsContainer').innerHTML = '';
        return;
      }

      const rows = await Api.get('/api/data/prices' + Api.buildQuery(currentFilters()));
      const selectedYearSet = new Set(selectedYears);
      const rowsForSelectedYears = rows.filter((r) => selectedYearSet.has(r.year));

      renderTable(rowsForSelectedYears);
      renderCharts(rowsForSelectedYears, selectedYears);
    }

    function renderTable(rows) {
      const tableWrap = document.getElementById('tableWrap');
      if (rows.length === 0) {
        tableWrap.innerHTML = '<div class="empty-state">ไม่พบข้อมูลตามเงื่อนไขที่เลือก</div>';
        return;
      }
      const rowsHtml = rows.slice(0, 500).map((r) => `
        <tr>
          <td>${r.year}</td>
          <td>${MONTH_LABELS_TH[r.month - 1]}</td>
          <td>${r.size_category} ตัว/กก.</td>
          <td class="num">${formatNumber(r.price_baht)}</td>
          <td class="num">${formatNumber(r.container_count)}</td>
        </tr>
      `).join('');
      tableWrap.innerHTML = `
        <div class="data-table-wrap">
          <table class="data-table">
            <thead><tr><th>ปี (ค.ศ.)</th><th>เดือน</th><th>ขนาด</th><th>ราคา (บาท/กก.)</th><th>จำนวนตู้</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
        ${rows.length > 500 ? `<p style="font-size:0.75rem;color:var(--text-muted);margin-top:8px;">แสดง 500 จาก ${rows.length} รายการ - ใช้ตัวกรองเพื่อจำกัดผลลัพธ์ หรือ export เพื่อดูข้อมูลครบ</p>` : ''}
      `;
    }

    // สร้าง 1 การ์ด + 1 กราฟต่อปีที่เลือก แต่ละกราฟมีทุกขนาด (40-100) สีเดียวกัน=ขนาดเดียวกันทุกการ์ด
    function renderCharts(rows, selectedYears) {
      priceCharts.forEach((c) => ShrimpCharts.destroy(c));
      priceCharts = [];

      const container = document.getElementById('priceChartsContainer');
      container.innerHTML = selectedYears.map((year) => `
        <div class="card">
          <div class="card__title">แนวโน้มราคารายเดือน ปี ค.ศ. ${year} - แยกตามขนาด</div>
          <div style="height: 340px;"><canvas id="priceChart${year}"></canvas></div>
        </div>
      `).join('');

      for (const year of selectedYears) {
        const rowsForYear = rows.filter((r) => r.year === year);
        const sizeDatasets = SIZE_CATEGORIES.map((size) => {
          const bySize = new Map(rowsForYear.filter((r) => r.size_category === size).map((r) => [r.month, r.price_baht]));
          const data = Array.from({ length: 12 }, (_, i) => bySize.get(i + 1) ?? null);
          return { label: `${size} ตัว/กก.`, data };
        });

        const canvas = document.getElementById(`priceChart${year}`);
        priceCharts.push(ShrimpCharts.facetedLineChart(canvas, MONTH_LABELS_TH, sizeDatasets));
      }
    }

    function setupExportButtons() {
      const exportBar = document.getElementById('exportBar');
      exportBar.innerHTML = `
        <a class="btn btn-secondary" id="exportCsv">ดาวน์โหลด CSV</a>
        <a class="btn btn-secondary" id="exportExcel">ดาวน์โหลด Excel</a>
        <a class="btn btn-secondary" id="exportTablePdf">ดาวน์โหลด Table PDF</a>
        <a class="btn btn-secondary" id="exportFormPdf">ดาวน์โหลด Form PDF (รายงานสรุป)</a>
      `;

      const bindExport = (id, path) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', () => {
          window.location.href = Api.downloadUrl(`/api/export/${path}/prices`, currentFilters());
        });
      };
      bindExport('exportCsv', 'csv');
      bindExport('exportExcel', 'excel');
      bindExport('exportTablePdf', 'table-pdf');
      bindExport('exportFormPdf', 'form-pdf');
    }

    document.addEventListener('shrimp:ready', () => {
      setupExportButtons();
      populateYearOptions();
      document.querySelectorAll('#yearFilter .year-checkbox').forEach((cb) => {
        cb.addEventListener('change', () => {
          loadData().catch((err) => alert(err.message));
        });
      });
      loadData().catch((err) => {
        document.getElementById('tableWrap').innerHTML = `<div class="empty-state">โหลดข้อมูลไม่สำเร็จ: ${err.message}</div>`;
      });
    });

    document.getElementById('applyFilter').addEventListener('click', () => {
      loadData().catch((err) => alert(err.message));
    });
  </script>
</body>
</html>
